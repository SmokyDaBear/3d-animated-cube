<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <title>First 3d Project | Cool!</title>
  </head>
  <body>
    <div class="fixed-header">
      <h1>Css 3d Animations</h1>
      <nav class="menu">
        <button id="open-modal">See Tutorial</button>
      </nav>
    </div>
    <div class="modal-container" id="modal-container">
      <button id="close-modal">X</button>
      <div id="video-container"></div>
    </div>
    <div class="container scene">
      <div class="floor"></div>
      <div class="cube">
        <div class="front"></div>
        <div class="back"></div>
        <div class="left"></div>
        <div class="right"></div>
        <div class="top">
          <div class="ball-shadow"></div>
        </div>
        <!-- <div class="bottom"></div> -->
      </div>
      <div class="ball"></div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
